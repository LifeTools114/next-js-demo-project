<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>하노이 직구 도우미</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <b>🇻🇳 하노이 직구 도우미</b>
    <span id="src-badge" class="badge"></span>
  </header>

  <div id="maint-banner" hidden></div>

  <nav class="tabs">
    <button data-tab="cart" aria-pressed="true">견적함</button>
    <button data-tab="ops" aria-pressed="false">운영</button>
    <button data-tab="settings" aria-pressed="false">설정</button>
  </nav>

  <section id="tab-cart">
    <div id="cart-empty" class="empty" hidden>
      <div class="empty-icon">🧾</div>
      담은 상품이 없습니다.<br>
      <small>쿠팡 상품 페이지에서 견적함에 담아보세요.</small>
    </div>
    <div id="cart-list"></div>
    <div id="cart-quote"></div>
    <div id="cart-actions" class="actions" hidden>
      <button id="btn-order" class="btn">주문 요청하기</button>
      <div id="order-note" hidden style="margin-top:8px;padding:10px;border-radius:9px;background:#f2f6fb;font-size:12px;line-height:1.6;color:#333d4b">
        <b>배송만은 쿠팡 결제가 먼저입니다.</b><br>
        ① 쿠팡에서 직접 결제 (배송지는 저희 창고로)<br>
        ② 결제가 끝나면 뜨는 <b>[하노이 배송 신청]</b> 을 누르세요<br>
        <button id="order-late" style="margin-top:6px;border:0;background:none;color:#8b95a1;font-size:11px;text-decoration:underline;cursor:pointer;padding:0">이미 결제를 마쳤는데 그 화면을 놓쳤어요 → 신청서 열기</button>
      </div>
      <button id="btn-clear" class="btn ghost">견적함 비우기</button>
    </div>
  </section>

  <section id="tab-ops" hidden>
    <label class="field">
      <span>운영자 토큰 <small id="ops-token-state"></small></span>
      <input id="ops-token" type="password" placeholder="ADMIN_TOKEN">
    </label>
    <button id="ops-token-save" class="btn ghost">토큰 저장</button>
    <p id="ops-empty" class="empty" hidden>
      토큰을 저장하면 발주 대기 주문이 여기 나타납니다.<br>
      <small>쿠팡에서 결제하면 주문번호·금액이 자동 수집됩니다.</small>
    </p>
    <div id="ops-list"></div>
  </section>

  <section id="tab-settings" hidden>
    <label class="field">
      <span>배송 지역</span>
      <select id="zone"></select>
    </label>
    <label class="field">
      <span>기본 이용 방식</span>
      <select id="track">
        <option value="forwarding">배송대행 — 직접 결제하고 배송만 맡김</option>
        <option value="agent">구매대행 — 결제까지 대신 맡김</option>
      </select>
    </label>
    <label class="field">
      <span>백엔드 주소</span>
      <input id="backend" type="url" placeholder="http://localhost:3000">
    </label>
    <div id="policy" class="policy"></div>
    <p class="disc" id="disclosure"></p>
  </section>

  <script src="../../vendor/calc.js"></script>
  <script src="popup.js"></script>
</body>
</html>
